# Azure Pipelines Configuration for CanvApps
# Builds CanvApps Framework & Preview Bundle for deployment

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js 20.x'

- script: |
    npm install
  displayName: 'Install Dependencies'

- script: |
    npm run build:lib
    npm run build:preview-code
  displayName: 'Build CanvApps Framework & Preview Bundle (preview-code/bundle)'

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(System.DefaultWorkingDirectory)/preview-code/bundle'
    artifact: 'canvapps-preview'
    publishLocation: 'pipeline'
  displayName: 'Publish preview-code/bundle Artifact'
