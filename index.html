<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CanvApps - Canvas UI Framework</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="alternate icon" type="image/svg+xml" href="./icon.svg" />
  <meta name="theme-color" content="#f8fafc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <script>
    // GitHub Pages SPA redirect receiver & dynamic base URL resolver
    (function(l, d) {
      var pathParts = l.pathname.split('/').filter(Boolean);
      var isProject = l.hostname.endsWith('github.io') && pathParts.length > 0;
      var repoPrefix = isProject ? '/' + pathParts[0] + '/' : '/';
      d.write('<base href="' + l.origin + repoPrefix + '">');

      if (l.search && l.search.indexOf('p=') !== -1) {
        try {
          var params = new URLSearchParams(l.search);
          var p = params.get('p');
          var q = params.get('q');
          if (p) {
            var targetPath = (isProject ? '/' + pathParts[0] : '') + (p.startsWith('/') ? p : '/' + p);
            var targetSearch = q ? ('?' + q) : '';
            window.history.replaceState(null, null, targetPath + targetSearch + l.hash);
          }
        } catch(e) {}
      }
    }(window.location, document));
  </script>
  <style>
    :root {
      --sat: max(env(safe-area-inset-top, 0px), env(titlebar-area-height, 0px));
      --sar: max(env(safe-area-inset-right, 0px), env(titlebar-area-width, 0px));
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: max(env(safe-area-inset-left, 0px), env(titlebar-area-x, 0px));
    }
    * {
      box-sizing: border-box;
      margin: 0;

      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;

      -webkit-touch-callout: none;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    #app-container {
      width: 100%;
      height: 100%;
      display: flex;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    canvas {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      outline: none;
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <div id="app-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
