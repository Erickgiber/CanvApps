<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>CanvApps - Canvas UI Framework</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="alternate icon" type="image/svg+xml" href="./icon.svg" />
  <script>
    // GitHub Pages SPA redirect receiver (restores deep links from 404.html)
    (function(l) {
      if (l.search && l.search.indexOf('p=') !== -1) {
        try {
          var params = new URLSearchParams(l.search);
          var p = params.get('p');
          var q = params.get('q');
          if (p) {
            var pathParts = l.pathname.split('/').filter(Boolean);
            var isProject = l.hostname.endsWith('github.io') && pathParts.length > 0;
            var repoPrefix = isProject ? '/' + pathParts[0] : '';
            var targetPath = repoPrefix + (p.startsWith('/') ? p : '/' + p);
            var targetSearch = q ? ('?' + q) : '';
            window.history.replaceState(null, null, targetPath + targetSearch + l.hash);
          }
        } catch(e) {}
      }
    }(window.location));
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    #app-container {
      width: 100%;
      height: 100%;
      display: flex;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    canvas {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      outline: none;
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <div id="app-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
